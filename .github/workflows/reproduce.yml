name: Reproduce case and skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test current checkout
        run: python -m unittest discover -s tests -v
      - name: Reproduce current complete case
        run: python scripts/heritage.py reproduce --case cases/persepolis --out build/persepolis
      - name: Download and reproduce the published project and skills
        run: python scripts/ci_release_smoke.py --tag v0.1.0 --out "${{ runner.temp }}/heritage-release-reader"
      - name: Preserve the actual reader report and logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-reader-${{ runner.os }}-py${{ matrix.python }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/heritage-release-reader/report.json
            ${{ runner.temp }}/heritage-release-reader/*.log
